server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: resume-job-match-analyzer
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resume_analyzer}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:local-only-change-me}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
