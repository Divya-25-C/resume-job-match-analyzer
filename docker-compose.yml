services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d resume_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_NAME: resume_analyzer
      DB_USERNAME: app
      DB_PASSWORD: ${DB_PASSWORD:-local-only-change-me}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "8081:80"
    depends_on:
      - backend
volumes:
  postgres_data:
